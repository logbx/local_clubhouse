stages:
  - deploy

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "Debugging SSH key..."
    - echo "Key length:"; echo "$SSH_PRIVATE_KEY" | wc -l
    - echo "First line:"; echo "$SSH_PRIVATE_KEY" | head -n 1
    - echo "Last line:"; echo "$SSH_PRIVATE_KEY" | tail -n 1
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -v - || echo "Failed to add key"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - ssh -vvv root@62.72.26.151 "echo 'SSH connection test'" || (echo "SSH connection failed. Checking known_hosts..."; cat ~/.ssh/known_hosts)
  script:
    - echo "🚀 Starting deployment to VPS..."
    - |
      for i in {1..3}; do
        echo "Attempt $i of 3..."
        ssh root@62.72.26.151 "
          cd /root/saas-app && \
          git pull origin main && \
          cd backend && npm install --legacy-peer-deps && npm run build && \
          cd ../frontend && npm install && npm run build && \
          pm2 restart all || pm2 start dist/main.js --name saas-backend
        " && break || {
          echo "Deployment attempt $i failed"
          sleep 5
        }
      done
  only:
    - main
  environment:
    name: production
    url: http://62.72.26.151:5000
