stages:
  - deploy

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "🚀 Starting deployment to VPS..."
    - |
      for i in {1..3}; do
        echo "Attempt $i of 3..."
        ssh root@62.72.26.151 "
          cd /root/saas-app && \
          git pull origin main && \
          npm install && \
          npm run build && \
          pm2 restart all || pm2 start dist/app.js --name saas-app
        " && break || sleep 5
      done
  only:
    - main
  environment:
    name: production
    url: http://62.72.26.151:5000
