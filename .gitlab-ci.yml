stages:
  - deploy

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    # Debug SSH key
    - echo "Debugging SSH key..."
    - echo "Key length: $(echo "$SSH_PRIVATE_KEY" | wc -l) lines"
    - echo "First line: $(echo "$SSH_PRIVATE_KEY" | head -n 1)"
    - echo "Last line: $(echo "$SSH_PRIVATE_KEY" | tail -n 1)"
    # Try to add key with maximum verbosity
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -v - || {
        echo "Failed to add key. Checking key format..."
        echo "$SSH_PRIVATE_KEY" | ssh-keygen -l -f - || echo "Invalid key format"
      }
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    # Test SSH connection with maximum verbosity
    - ssh -vvv root@62.72.26.151 "echo 'SSH connection test'" || {
        echo "SSH connection failed. Checking known_hosts..."
        cat ~/.ssh/known_hosts
      }
  script:
    - echo "🚀 Starting deployment to VPS..."
    - |
      for i in {1..3}; do
        echo "Attempt $i of 3..."
        ssh -vvv root@62.72.26.151 "
          cd /root/saas-app && \
          git pull origin main && \
          npm install && \
          npm run build && \
          pm2 restart all || pm2 start dist/app.js --name saas-app
        " && break || {
          echo "Deployment attempt $i failed"
          sleep 5
        }
      done
  only:
    - main
  environment:
    name: production
    url: http://62.72.26.151:5000
